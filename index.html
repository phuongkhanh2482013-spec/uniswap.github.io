<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniSwap Đà Nẵng</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5EF;--sf:#fff;--ink:#13261B;--mu:#587063;--ln:#D6E0D8;--br:#1E5B3F;--bi:#fff;--so:#DDEFE2;--co:#F2B632;--bad:#B3402F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1912;--sf:#16251C;--ink:#E8F1EA;--mu:#9BB0A2;--ln:#26392D;--br:#58C08A;--bi:#0B1F14;--so:#1D3527;--bad:#F08A78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1912;--sf:#16251C;--ink:#E8F1EA;--mu:#9BB0A2;--ln:#26392D;--br:#58C08A;--bi:#0B1F14;--so:#1D3527;--bad:#F08A78;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--co);outline-offset:2px}
.mu{color:var(--mu)}.err{color:var(--bad);min-height:1.4em;font-size:14px}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--br);color:var(--bi);padding:56px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.15;font-weight:800;max-width:15em}
.hero ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:1.5px solid currentColor;border-radius:99px;padding:3px 12px;font-size:13px}
.logo{font-weight:800;font-size:20px}
.panel{padding:40px 28px;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:400px;display:grid;gap:16px}
form{display:grid;gap:12px}label{display:grid;gap:4px;font-weight:500;font-size:14px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf)}
.otp{font-size:26px;letter-spacing:.5em;text-align:center;font-weight:700}
.btn{border:0;background:var(--br);color:var(--bi);padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.ghost{background:var(--so);color:var(--ink)}.full{width:100%}.big{padding:16px;font-size:17px}
.lk{background:none;border:0;color:var(--br);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
summary.lk{display:inline-block}
.demo{background:var(--so);border-radius:10px;padding:10px 12px;font-size:14px}
.alt{text-align:center;font-size:14px}
.top{max-width:520px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.pill{background:var(--co);color:#3A2A00;font-weight:700;border-radius:99px;padding:4px 12px;font-size:14px}
main.app{max-width:520px;margin:0 auto;padding:4px 16px 110px;display:grid;gap:16px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
.bar button{flex:1;max-width:120px;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer}
.bar [aria-current=true]{background:var(--so);color:var(--ink)}
.dot{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row select{flex:1;min-width:130px}
.tag{position:relative;background:var(--sf);border:2px solid var(--ln);border-radius:22px;margin-top:18px;overflow:hidden}
.tag::before{content:"";position:absolute;top:10px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--bg);border:2px solid var(--ln);z-index:1}
.art{height:230px;display:grid;place-items:center;font-size:92px}
.tb{padding:14px 18px 18px;display:grid;gap:4px}.tb h3{font-size:20px}
.want{background:var(--so);border-radius:8px;padding:6px 10px;font-weight:500;margin-top:6px}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.box{background:var(--sf);border:1.5px solid var(--ln);border-radius:16px;padding:14px;display:grid;gap:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{border:2px solid var(--ln);border-radius:14px;background:var(--sf);padding:0;cursor:pointer;text-align:left;overflow:hidden}
.it[aria-pressed=true]{border-color:var(--br);box-shadow:0 0 0 2px var(--br)}
.it .art{height:100px;font-size:46px}.it div:last-child{padding:8px 10px;font-size:13px}
.swap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.swap .art{height:110px;font-size:50px;border-radius:14px}
.th{width:64px;flex:none}.th .art{height:64px;font-size:30px;border-radius:10px}.ev .art{height:100px;font-size:46px;border-radius:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats b{font-size:28px;line-height:1.1}
.stars{display:flex;gap:2px}.stars button{background:none;border:0;font-size:34px;cursor:pointer;color:var(--co);padding:2px}
.msgs{display:grid;gap:8px}
.chh{display:flex;align-items:center;gap:12px}.chh p{font-size:13px}
.av{width:40px;height:40px;border-radius:50%;background:var(--br);color:var(--bi);display:grid;place-items:center;font-weight:800;flex:none}
.dotg{width:8px;height:8px;border-radius:50%;background:#3DBE7A;display:inline-block;margin-right:6px}
.pin{display:flex;align-items:center;gap:10px;background:var(--so);border-radius:14px;padding:10px}.pin .th{width:44px}.pin .th .art{height:44px;font-size:22px;border-radius:8px}.pin div:last-child{min-width:0}
.day{text-align:center;font-size:12px;color:var(--mu)}
.ml{display:flex;gap:8px;align-items:flex-end}.ml .av{width:28px;height:28px;font-size:13px}.mr{display:flex;justify-content:flex-end}
.b{max-width:78%;padding:9px 14px;border-radius:18px 18px 18px 4px;background:var(--sf);border:1px solid var(--ln)}
.b.me{border:0;background:var(--br);color:var(--bi);border-radius:18px 18px 4px 18px}
.comp{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0;display:grid;gap:8px}
.chips2{display:flex;gap:8px;overflow-x:auto}.chips2 button{white-space:nowrap;border:1.5px solid var(--ln);background:var(--sf);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500}
.comp form{display:flex;gap:8px;align-items:center}.comp input{border-radius:99px;padding:12px 18px}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--br);color:var(--bi);font-size:18px;cursor:pointer;flex:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;text-align:center}
.toast.on{opacity:1}
.hero.lt{background:linear-gradient(160deg,var(--so),var(--bg));color:var(--ink)}.hero.lt h1{font-size:clamp(26px,3vw,36px)}.rack{font-size:44px;letter-spacing:6px}
.tp{align-items:flex-start}.tc{width:100%;max-width:620px;display:grid;gap:14px}
details.pol{background:var(--sf);border:1.5px solid var(--ln);border-radius:16px}
details.pol>summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:14px}
details.pol>summary::-webkit-details-marker{display:none}
.pi{width:44px;height:44px;border-radius:12px;background:var(--so);display:grid;place-items:center;font-size:22px;flex:none}
.chev{color:var(--mu);transition:transform .2s}details[open] .chev{transform:rotate(180deg)}
.pb{padding:0 16px 16px;max-height:340px;overflow:auto;font-size:14px}.pb h4{margin:14px 0 4px;font-size:15px}.pb ol,.pb ul{margin:4px 0 8px;padding-left:22px}.pb p{margin:4px 0}
.cb{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14.5px}.cb input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--br)}
@media(max-width:800px){.auth{grid-template-columns:1fr}.hero{padding:32px 20px}.panel{padding:28px 16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div id="app"></div><div id="toast" class="toast" role="status"></div>
<script>
const SC=["Đại học Kinh tế","Đại học Bách khoa","Đại học Ngoại ngữ","Đại học Sư phạm","Đại học Duy Tân","Viện Nghiên cứu và Đào tạo Việt – Anh, Đại học Đà Nẵng (VNUK)"];
const AR=["Làng Đại học","Hòa Khánh","Ngũ Hành Sơn","Hải Châu"];
const SZ=["XS","S","M","L","XL","XXL","Free size","36","37","38","39","40","41","42","43"];
const CAT={"👔":"Áo","👕":"Áo","🧶":"Áo","👖":"Quần","🩳":"Quần","👗":"Váy/đầm","🧥":"Áo khoác","👟":"Giày","👜":"Phụ kiện"};
const P=[
[1,"Linh",0,"4.9",2,[["Áo sơ mi trắng","👔","#E3EEE6","M","Mới 90%","Áo khoác jean"],["Chân váy xếp ly","👗","#F3E1E8","S","Mới 85%","Hoodie"],["Túi tote vải","👜","#F5E9CC","Free size","Mới 80%","Sneaker"]]],
[2,"Minh",5,"4.8",3,[["Hoodie xám","🧥","#DDE5EE","L","Mới 90%","Áo thun oversize"],["Quần jean ống rộng","👖","#D3DDF0","M","Mới 85%","Áo sơ mi"]]],
[3,"Hà",2,"5.0",0,[["Đầm hoa nhí","👗","#F7E0D6","S","Mới 95%","Áo len"],["Áo len kem","🧶","#EFE8D8","M","Mới 80%","Quần culottes"]]],
[4,"Khoa",1,"4.7",1,[["Áo thun in hình","👕","#E1EEDD","L","Mới 85%","Quần short"],["Giày canvas","👟","#E8E4F2","42","Mới 75%","Balo"]]],
[5,"An",3,"4.9",0,[["Áo khoác gió","🧥","#D9ECEA","M","Mới 90%","Áo polo"]]],
[6,"Phúc",4,"4.6",3,[["Quần short kaki","🩳","#F0E6D2","M","Mới 85%","Áo thun"]]]
].map(([id,name,s,r,a,it])=>({id,name,school:SC[s],r,area:AR[a],items:it.map(([n,e,c,z,q,w],i)=>({id:id+"-"+i,n,e,c,s:z,q,w,p:id,st:'show'}))}));
const REW=[[100,"Voucher 10.000đ tại quán cà phê đối tác"],[200,"Túi vải Canvas UniSwap hoặc voucher 30.000đ đồ secondhand"],[300,"Bình nước tre/thép không gỉ hoặc combo ăn uống"]];
const EV=[["Ngày hội Đổi đồ trực tiếp (Campus Swap Fair)","12/12/2026, 8:00–11:30","Sảnh trường Đại học (địa điểm cụ thể sẽ cập nhật)","Mang đồ cũ đến đổi trực tiếp, thử size và gặp bạn bè yêu thời trang bền vững. Mở cho sinh viên các trường tại Đà Nẵng.",1,"🔄","#DDEFE2"],
["Chiến dịch quyên góp “Áo ấm vùng cao”","01/12/2026 – 15/01/2027","Thùng quyên góp tại sảnh KTX và văn phòng Đoàn trường","Quyên góp quần áo ấm hoặc đồ còn dùng tốt chưa tìm được người đổi. Đồ được phân loại, giặt sạch và gửi tặng trẻ em vùng cao.",1,"🧣","#F5E9CC"],
["Workshop sống xanh: biến áo cũ thành túi tote","05/11/2026, 14:00","Thư viện trường","Hướng dẫn tái chế áo cũ thành túi tote cùng CLB Môi trường.",0,"👜","#E3EEE6"]];
const T1=[
["Điều 1. Giới thiệu và phạm vi áp dụng","p",["UniSwap Đà Nẵng là nền tảng kết nối sinh viên nhằm trao đổi quần áo đã qua sử dụng, khuyến khích tái sử dụng, giảm lãng phí và xây dựng cộng đồng thời trang bền vững.","Khi đăng ký tài khoản và sử dụng UniSwap, người dùng xác nhận đã đọc, hiểu và đồng ý tuân thủ các điều khoản được công bố."]],
["Điều 2. Điều kiện đăng ký tài khoản","o",["Người dùng phải là sinh viên thuộc cơ sở đào tạo được UniSwap hỗ trợ.","Người dùng phải cung cấp thông tin chính xác, bao gồm họ tên, trường học, mã số sinh viên và email trường.","Người dùng phải hoàn tất quy trình xác minh tài khoản theo hướng dẫn của hệ thống.","Mỗi người dùng chỉ được duy trì một tài khoản cá nhân, trừ trường hợp được Ban quản trị cho phép.","Người dùng chịu trách nhiệm bảo mật thông tin đăng nhập.","Nghiêm cấm giả mạo danh tính, sử dụng thông tin sinh viên của người khác hoặc tạo tài khoản nhằm gian lận."]],
["Điều 3. Quy định đăng tải quần áo","o",["Mỗi bài đăng chỉ được giới thiệu một món đồ.","Người đăng phải cung cấp từ 2–4 hình ảnh thực tế của sản phẩm.","Thông tin sản phẩm phải bao gồm tên, danh mục, kích cỡ, tình trạng, mô tả và loại đồ mong muốn nhận đổi.","Quần áo phải được vệ sinh phù hợp và còn khả năng sử dụng.","Người đăng phải mô tả trung thực các khuyết điểm, vết bẩn hoặc hư hỏng đáng kể.","Không đăng hàng hóa bất hợp pháp, hàng giả, đồ không thuộc quyền trao đổi hợp pháp của mình hoặc sản phẩm vi phạm quyền sở hữu trí tuệ.","Ban quản trị có quyền kiểm duyệt, ẩn hoặc gỡ bỏ nội dung vi phạm."]],
["Điều 4. Nguyên tắc trao đổi quần áo","o",["UniSwap áp dụng nguyên tắc trao đổi một món đồ lấy một món đồ (1:1).","Giao dịch chỉ được hình thành khi cả hai bên cùng đồng ý với cặp sản phẩm trao đổi.","Không hỗ trợ trao đổi theo combo hoặc nhiều món lấy một món.","Không được yêu cầu thanh toán, chuyển khoản, đặt cọc hoặc trả khoản chênh lệch trong quy trình trao đổi của UniSwap.","Chức năng trò chuyện giữa hai bên được mở sau khi cả hai đồng ý trao đổi.","Mỗi bên có quyền từ chối nhận món đồ không đúng mô tả hoặc không đáp ứng điều kiện đã thống nhất."]],
["Điều 5. Gặp mặt và hoàn tất giao dịch","o",["Hai bên tự thống nhất thời gian và địa điểm trao đổi.","Khuyến khích lựa chọn nơi công cộng, đủ ánh sáng và có người qua lại như sảnh trường, thư viện hoặc căng-tin.","Người dùng có quyền dừng giao dịch khi cảm thấy không an toàn.","Hai bên có trách nhiệm kiểm tra sản phẩm trước khi xác nhận hoàn tất.","Giao dịch chỉ được hệ thống ghi nhận hoàn tất khi cả hai bên xác nhận trao đổi thành công.","Nghiêm cấm xác nhận giao dịch giả nhằm nhận Điểm Xanh."]],
["Điều 6. Đánh giá sau giao dịch","o",["Sau khi hoàn tất giao dịch, người dùng có thể đánh giá đối phương từ 1–5 sao và gửi nhận xét.","Đánh giá phải phản ánh trải nghiệm thực tế.","Không được đăng đánh giá giả, xúc phạm, đe dọa hoặc tiết lộ thông tin cá nhân của người khác.","Ban quản trị có thể xem xét và xử lý các đánh giá vi phạm."]],
["Điều 7. Điểm Xanh và chương trình quyền lợi","o",["Điểm Xanh là hệ thống ghi nhận và khuyến khích hoạt động trao đổi bền vững.","Mỗi giao dịch hợp lệ có thể mang lại 50 Điểm Xanh cho mỗi bên sau khi cả hai xác nhận hoàn tất.","Hệ thống phân biệt Tổng Điểm Xanh tích lũy và Điểm Đổi Quà khả dụng.","Hai tài khoản chỉ được tính điểm thưởng cho tối đa một giao dịch trao đổi với nhau mỗi tháng.","Điểm Xanh không phải tiền và không được chuyển nhượng hoặc quy đổi thành tiền mặt.","Hệ thống có quyền kiểm tra, điều chỉnh hoặc thu hồi điểm phát sinh từ hành vi gian lận.","Voucher, quà tặng, giấy chứng nhận và điểm rèn luyện chỉ được áp dụng khi chương trình đã được xác nhận và công bố chính thức."]],
["Điều 8. Các hành vi bị nghiêm cấm","u",["!Người dùng không được:","Lừa đảo, quấy rối, đe dọa hoặc phân biệt đối xử.","Đăng nội dung trái pháp luật hoặc không phù hợp với cộng đồng sinh viên.","Giả mạo danh tính, giao dịch hoặc đánh giá.","Thu thập và sử dụng trái phép thông tin cá nhân của người khác.","Phát tán đường dẫn độc hại, spam hoặc can thiệp trái phép vào hệ thống.","Lợi dụng nền tảng để mua bán thương mại trái với nguyên tắc trao đổi không dùng tiền.","Thông đồng nhằm trục lợi từ Điểm Xanh hoặc chương trình quà tặng."]],
["Điều 9. Xử lý vi phạm và tranh chấp","p",["UniSwap có thể áp dụng biện pháp cảnh báo, hạn chế chức năng, ẩn nội dung hoặc đình chỉ tài khoản khi có căn cứ xác định hành vi vi phạm.","Người dùng có quyền gửi báo cáo, cung cấp bằng chứng và yêu cầu xem xét lại quyết định xử lý.","UniSwap hỗ trợ tiếp nhận và xem xét phản ánh trong phạm vi vận hành nền tảng. UniSwap không trực tiếp giữ, vận chuyển hoặc kiểm định từng món đồ, nhưng vẫn thực hiện các trách nhiệm bắt buộc theo pháp luật áp dụng."]],

function policy(){const c=S.user.consent;return `<div class="li"><h2>Điều khoản &amp; Chính sách</h2><button class="btn ghost" data-a="tab" data-v="profile">Quay lại</button></div><p class="mu">Phiên bản: Dự thảo 1.0${c?` · Bạn đã đồng ý lúc ${new Date(c.at).toLocaleString('vi-VN')}`:''}</p>${acc()}`}

 if(!S.req.length)return `<div class="box"><h2>Chưa có yêu cầu mới</h2><p class="mu">Khi có bạn muốn đổi đồ với bạn, yêu cầu sẽ hiện ở đây.</p></div>`;

 <div class="box"><div class="pin"><div class="th">${art(w.mine)}</div><b>⇄</b><div class="th">${art(w.theirs)}</div><div><b>1 món đổi 1 món</b><p class="mu">${esc(w.mine.n)} ⇄ ${w.theirs.n}</p></div></div>
 <button class="btn ${w.st?'ghost':''}" data-a="done" ${w.st?'disabled':''}>${w.st==='wait'?`Đang chờ ${w.p.name} xác nhận…`:'Xác nhận đã hoàn tất trao đổi'}</button></div>

 <form data-f="chat"><input name="t" placeholder="Nhập tin nhắn…" aria-label="Tin nhắn" autocomplete="off" required><button class="send" aria-label="Gửi">➤</button></form></div>`;
}
function rate(){
 const w=S.sw,s=S.rt;
 return `<div class="box"><h2>Đánh giá ${w.p.name}</h2><p class="mu">Món đồ có đúng mô tả không? Thái độ và việc đúng hẹn thế nào?</p>
 <div class="stars" role="group" aria-label="Số sao">${[1,2,3,4,5].map(n=>`<button type="button" data-a="star" data-v="${n}" aria-pressed="${n<=s}" aria-label="${n} sao">${n<=s?'★':'☆'}</button>`).join('')}</div>
 <form data-f="rate"><label>Nhận xét ngắn<input name="t" maxlength="120"></label><p class="err" id="err" role="alert"></p><button class="btn full">Gửi đánh giá (+5 Điểm Xanh)</button></form></div>`;
}
const row=(i,del)=>`<div class="box li"><div class="row" style="flex-wrap:nowrap;align-items:center"><div class="th">${art(i)}</div><div><b>${esc(i.n)}</b><p class="mu">${CAT[i.e]||''} · Size ${esc(i.s)} · ${esc(i.q)}<br>Tìm đổi: ${esc(i.w)}</p></div></div>${del?`<button class="lk" data-a="del" data-id="${i.id}">Gỡ</button>`:''}</div>`;
function closet(){
 const u=S.user,G=[['show','Đang hiển thị'],['pend','Đang chờ trao đổi'],['done','Đã trao đổi']];
 return `<div class="li"><h2>Tủ đồ của tôi</h2><button class="btn" data-a="tab" data-v="add">Đăng món đồ</button></div>`+
 (u.items.length?G.map(([k,t])=>{const l=u.items.filter(i=>i.st===k);return `<h3>${t} (${l.length})</h3>`+(l.length?l.map(i=>row(i,k==='show')).join(''):`<p class="mu">Chưa có món nào.</p>`)}).join(''):`<div class="box"><p class="mu">Tủ đồ đang trống. Đăng món đầu tiên để bắt đầu trao đổi.</p></div>`);
}
function add(){
 return `<h2>Đăng món đồ</h2><p class="mu">Mỗi bài đăng chỉ cho một món đồ.</p>
 <form data-f="add" class="box"><label>Tải ảnh lên (tối đa 4 ảnh, không bắt buộc)<input name="ph" id="ph" type="file" accept="image/*" multiple></label><div class="row" id="prev"></div>
 <label>Tên món đồ<input name="n" required></label>
 <div class="row"><label style="flex:1">Danh mục<select name="e"><option value="👕">Áo</option><option value="👖">Quần</option><option value="👗">Váy/đầm</option><option value="🧥">Áo khoác</option><option value="👟">Giày</option><option value="👜">Phụ kiện</option></select></label>
 <label style="flex:1">Size (chọn gợi ý hoặc tự nhập)<input name="s" list="sizes" autocomplete="off" required></label></div><datalist id="sizes">${SZ.map(s=>`<option value="${s}">`).join('')}</datalist>
 <label>Độ mới<input name="q" placeholder="VD: Mới 90%, đã mặc 2 lần" required></label>
 <label>Mô tả<textarea name="d" rows="2" maxlength="200"></textarea></label><label>Món đồ mong muốn nhận đổi<input name="w" required></label>
 <p class="err" id="err" role="alert"></p><div class="acts" style="grid-template-columns:1fr 2fr"><button type="button" class="btn ghost" data-a="tab" data-v="closet">Hủy</button><button class="btn">Đăng lên tủ đồ</button></div></form>`;
}
function events(){
 const ev=S.user.ev,card=(x,i)=>{const[t,w,l,d,up,e,c]=x,r=ev.includes(i);return `<div class="box ev">${art({e,c})}<h3>${t}</h3><p class="mu">🕒 ${w}<br>📍 ${l}</p><p>${d}</p>`+(up?`<button class="btn ${r?'ghost':''}" data-a="evreg" data-i="${i}">${r?'Hủy đăng ký':'Đăng ký tham gia'}</button>`:`<details><summary class="lk">Xem chi tiết</summary><p class="mu">Sự kiện đã diễn ra. Ảnh và tổng kết hoạt động sẽ được cập nhật tại đây.</p></details>`)+`</div>`};
 return `<h2>Sự kiện</h2><p class="demo">Thời gian và địa điểm dưới đây là dữ liệu mẫu cho prototype. Điểm Xanh được ghi nhận sau khi ban tổ chức xác nhận.</p><h3>Sắp diễn ra</h3>${EV.map((x,i)=>x[4]?card(x,i):'').join('')}<h3>Đã diễn ra</h3>${EV.map((x,i)=>x[4]?'':card(x,i)).join('')}`;
}
function profile(){
 const u=S.user,t=u.total;
 return `<div class="box"><h2>${esc(u.name)}</h2><p class="mu">${esc(u.school)}<br>MSSV ${esc(u.mssv)} · ${esc(u.email)}</p></div>
 <div class="stats"><div class="box"><span class="mu">Số món đã trao đổi</span><b>${u.sw}</b></div><div class="box"><span class="mu">Đánh giá trung bình</span><b>${avg(u)}</b></div>
 <div class="box"><span class="mu">Tổng Điểm Xanh (xét rèn luyện)</span><b>${t}</b></div><div class="box"><span class="mu">Điểm Đổi Quà (khả dụng)</span><b>${u.bal}</b></div></div>
 <p class="mu">${t>=300?'Đạt mốc +5 điểm rèn luyện và Giấy chứng nhận Đại sứ Thời trang Bền vững.':t>=150?'Đạt mốc +3 điểm rèn luyện. Còn '+(300-t)+' điểm để lên mốc +5.':'Còn '+(150-t)+' điểm để đạt mốc +3 điểm rèn luyện.'}</p>
 ${u.rv.length?`<h3>Nhận xét gần đây</h3>`+u.rv.slice(-3).map(x=>`<div class="box">★ ${x.s} · ${esc(x.n)}<br>${esc(x.t)}</div>`).join(''):''}
 <h2>Đổi quà</h2>${REW.map(([c,n])=>`<div class="box li"><div><b>${c} điểm</b><p class="mu">${n}</p></div><button class="btn" data-a="redeem" data-c="${c}" ${u.bal<c?'disabled':''}>Đổi</button></div>`).join('')}
 <button class="btn ghost" data-a="tab" data-v="policy">Điều khoản &amp; Chính sách</button>
 <button class="btn ghost" data-a="out">Đăng xuất</button>`;
}
function shell(){
 const V={feed,inbox,review,match,chat,rate,closet,add,events,profile,policy}[S.view]||feed,tab={feed:'feed',closet:'closet',add:'closet',events:'events',profile:'profile',policy:'profile'}[S.view]||'inbox';
 const nav=[['feed','Lướt đồ'],['inbox','Yêu cầu'],['closet','Tủ đồ'],['events','Sự kiện'],['profile','Hồ sơ']].map(([k,n])=>`<button data-a="tab" data-v="${k}" ${tab===k?'aria-current="true"':''}>${n}${k==='inbox'&&S.req.length&&S.user.items.some(i=>i.st==='show')?`<span class="dot">${S.req.length}</span>`:''}</button>`).join('');
 return `<header class="top"><span class="logo">UniSwap</span><span class="pill">🌿 ${S.user.bal} điểm</span></header><main class="app">${V()}</main><nav class="bar" aria-label="Điều hướng">${nav}</nav>`;
}
function render(){
 try{app.innerHTML=S.user?shell():auth();window.scrollTo(0,S.user&&S.view==='chat'?document.body.scrollHeight:0)}
 catch(e){console.error(e);app.innerHTML=`<div class="panel"><div class="card"><h2>Có lỗi xảy ra</h2><p class="mu">Bấm nút bên dưới để đặt lại dữ liệu và thử lại.</p><button class="btn full" data-a="reset">Đặt lại dữ liệu</button></div></div>`}
}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,v=b.dataset.v,u=S.user;
 if(a==='op'){const d=document.querySelectorAll('details.pol')[+b.dataset.i];d.open=true;d.scrollIntoView({block:'center'});return}
 else if(a==='agree'){const c=[...document.querySelectorAll('[data-t]')];if(!(c[0].checked&&c[1].checked))return;A.agree={v:'Dự thảo 1.0',at:Date.now(),mk:c[2].checked};A.pg='reg';A.step='form'}
 else if(a==='reset'){users=[];persist();save('us3_sess',null);S.user=null;S.view='feed';S.req=[{p:1},{p:2}];A.pg='welcome';A.step='form'}
 else if(a==='pg'){A.pg=v==='reg'&&!A.agree?'terms':v;A.step='form'}
 else if(a==='resend'){A.code=otp();toast('Đã gửi lại mã mới')}
 else if(a==='back'){A.step='form'}
 else if(a==='tab')S.view=v;
 else if(a==='skip')S.fi++;
 else if(a==='again')S.fi=0;
 else if(a==='want'){const it=flt()[S.fi],p=pp(it.p);
  if(!u.items.some(i=>i.st==='show')){toast('Hãy đăng ít nhất 1 món đồ trước khi gửi yêu cầu.');S.view='add'}
  else{toast(`Đã gửi yêu cầu đến ${p.name}. Chat chỉ mở khi hai bên xác nhận trao đổi 1:1.`);S.fi++}}
 else if(a==='open'){S.cur=pp(+b.dataset.id);S.sel='';S.mine=b.dataset.m;S.view='review'}
 else if(a==='pickt')S.sel=b.dataset.id;
 else if(a==='decline'){S.req=S.req.filter(x=>x.p!==S.cur.id);S.view='inbox';toast('Đã từ chối yêu cầu.')}
 else if(a==='accept'){const m=u.items.find(i=>i.id===S.mine),t=S.cur.items.find(i=>i.id===S.sel);if(!m||!t)return;
  m.st='pend';persist();S.sw={p:S.cur,mine:m,theirs:t};S.req=S.req.filter(x=>x.p!==S.cur.id);
  S.chat=[{me:false,t:`Chào bạn! Mình đổi ${t.n} lấy ${m.n} nhé. Mình gặp nhau ở trường nhé?`}];S.view='match'}
 else if(a==='tochat')S.view='chat';
 else if(a==='loc')S.chat.push({me:true,t:`Mình hẹn ở ${v} nhé.`});
 else if(a==='done'){const w=S.sw;if(w.st)return;w.st='wait';
  setTimeout(()=>{w.st='ok';w.mine.st='done';const l=u.pairs[w.p.id],ok=!l||Date.now()-l>2592e6;if(ok){u.total+=50;u.bal+=50;u.pairs[w.p.id]=Date.now()}u.sw++;persist();
   toast(ok?'Cả hai đã xác nhận. +50 Điểm Xanh!':'Cả hai đã xác nhận. Bạn đã đổi với bạn này trong 30 ngày qua nên chưa cộng thêm Điểm Xanh.');
   if(S.view==='chat')S.view='rate';render()},1500)}
 else if(a==='star')S.rt=+v;
 else if(a==='redeem'){const c=+b.dataset.c;if(u.bal>=c){u.bal-=c;persist();toast(`Đã đổi. Mã QR: UNI-${otp()} (quét tại quầy đối tác)`)}}
 else if(a==='del'){u.items=u.items.filter(i=>i.id!==b.dataset.id);persist()}
 else if(a==='evreg'){const i=+b.dataset.i;u.ev=u.ev.includes(i)?u.ev.filter(x=>x!==i):[...u.ev,i];persist();toast(u.ev.includes(i)?'Đã đăng ký tham gia sự kiện.':'Đã hủy đăng ký.')}
 else if(a==='out'){S.user=null;save('us3_sess',null);A.pg='welcome';A.step='form'}
 render();
});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.f;
 if(['fs','fa','fc','fz'].includes(k)){S[k]=t.value;S.fi=0;render()}
 else if(t.dataset.t!==undefined){const c=[...document.querySelectorAll('[data-t]')];$('#go').disabled=!(c[0].checked&&c[1].checked)}
 else if(t.id==='ph'){Promise.all([...t.files].slice(0,4).map(shrink)).then(a=>{$('#prev').innerHTML=a.map(s=>`<img src="${s}" alt="Ảnh xem trước" style="width:72px;height:72px;object-fit:cover;border-radius:10px">`).join('')}).catch(()=>{})}});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,k=f.dataset.f,d=Object.fromEntries(new FormData(f)),u=S.user;
 if(k==='login'){const x=users.find(y=>y.email===d.email.trim().toLowerCase()&&y.pw===d.pw);
  if(!x)return err('Email hoặc mật khẩu chưa đúng. Nếu chưa có tài khoản, hãy chọn Đăng ký.');
  S.user=x;save('us3_sess',x.email);S.view='feed';render()}
 else if(k==='reg'||k==='forgot'){const em=d.email.trim().toLowerCase(),ex=users.some(y=>y.email===em);
  if(k==='reg'&&ex)return err('Email này đã đăng ký. Hãy chuyển sang Đăng nhập.');
  if(k==='forgot'&&!ex)return err('Không tìm thấy tài khoản với email này.');
  if(d.pw.length<6)return err('Mật khẩu cần từ 6 ký tự.');
  if(d.pw!==d.pw2)return err('Mật khẩu xác nhận chưa khớp.');
  A.p={school:d.school,name:(d.name||'').trim(),mssv:(d.mssv||'').trim(),email:em,pw:d.pw,reset:k==='forgot'};A.code=otp();A.step='otp';render()}
 else if(k==='otp'){if(d.o.trim()!==A.code)return err('Mã OTP chưa đúng. Kiểm tra lại hoặc bấm Gửi lại mã.');
  if(A.p.reset){users.find(y=>y.email===A.p.email).pw=A.p.pw;persist();A.pg='login';A.step='form';render();toast('Đã đổi mật khẩu. Hãy đăng nhập.')}
  else{const{reset,...r}=A.p,x={...r,total:10,bal:10,items:[],rv:[],pairs:{},ev:[],sw:0,consent:A.agree};A.agree=null;users.push(x);persist();S.user=x;save('us3_sess',x.email);S.view='feed';A.step='form';render();toast('Xác minh thành công! +10 Điểm Xanh')}}
 else if(k==='search'){S.fq=d.q.trim();S.fi=0;render()}
 else if(k==='add'){const fl=[...f.elements.ph.files];
  if(fl.length>4||!fl.every(x=>x.type.startsWith('image/')))return err('Chỉ tải tối đa 4 ảnh (JPG hoặc PNG).');
  Promise.all(fl.map(shrink)).then(ph=>{u.items.push({id:'u'+Date.now(),n:d.n.trim(),e:d.e,c:'#DDEFE2',s:d.s.trim(),q:d.q.trim(),d:d.d.trim(),w:d.w.trim(),ph,p:0,st:'show'});persist();S.view='closet';render();toast('Đã đăng lên tủ đồ.')}).catch(()=>err('Không đọc được ảnh. Thử ảnh JPG hoặc PNG khác.'))}
 else if(k==='chat'){S.chat.push({me:true,t:d.t});render();setTimeout(()=>{S.chat.push({me:false,t:'Ok bạn nhé!'});if(S.view==='chat')render()},900)}
 else if(k==='rate'){if(!S.rt)return err('Hãy chọn số sao.');
  u.bal+=5;u.total+=5;u.rv.push({n:S.sw.p.name,s:5,t:'Đúng mô tả, đúng hẹn. (nhận xét mẫu)'});S.rt=0;persist();S.view='profile';render();toast('Cảm ơn bạn đã đánh giá! +5 Điểm Xanh')}
});
render();
</script></body></html>
